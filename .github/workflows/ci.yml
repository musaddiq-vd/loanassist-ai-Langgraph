name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # lets the evals job sign in to AWS with OIDC (no stored AWS keys)

jobs:
  tests:
    name: Unit + API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests

  evals:
    name: Golden-set evals (real Bedrock)
    needs: tests
    # Runs only after you add the repository variable AWS_EVAL_ROLE_ARN (see evals/README.md).
    if: ${{ vars.AWS_EVAL_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_EVAL_ROLE_ARN }}
          aws-region: us-east-1
      - name: Run evals
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}   # optional: also logs traces to LangSmith
        run: python evals/run_evals.py --min-pass 0.85
      - name: Add report to the run summary
        if: always()
        run: cat evals/results/latest.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
